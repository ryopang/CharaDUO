name: PartyCharades
options:
  bundleIdPrefix: com.ryopang
  developmentLanguage: en
  knownRegions: [en, zh-HK, zh-Hant, zh-Hans, Base]
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  Content:
    path: Packages/Content
  Core:
    path: Packages/Core
  Posture:
    path: Packages/Posture
  Capture:
    path: Packages/Capture
  Design:
    path: Packages/Design
targets:
  PartyCharades:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: Content
        product: Content
      - package: Core
        product: Core
      - package: Posture
        product: Posture
      - package: Capture
        product: Capture
      - package: Design
        product: Design
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "CharaDUO"
        # Read from the build settings below, so MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION are the one place the version lives.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: "en"
        CFBundleLocalizations: [en, zh-HK, zh-Hant, zh-Hans]
        # No custom cryptography — the app has no networking at all.
        ITSAppUsesNonExemptEncryption: false
        # PRD §7.1 — explicit and honest: what is recorded, and that it
        # stays on the device.
        NSCameraUsageDescription: "CharaDUO records the guessing team's reactions during a round so you can watch the highlights together at the end of the match. Video stays on this device and is never uploaded."
        NSMicrophoneUsageDescription: "CharaDUO records the table's audio so the highlight reel has sound. Audio stays on this device, is never uploaded, and is never analysed."
        # PRD §7.1 — requested only at the moment a player taps Save.
        NSPhotoLibraryAddUsageDescription: "CharaDUO saves the reaction reel you choose to your photo library. Nothing is saved unless you tap Save."
        UILaunchScreen:
          UIColorName: LaunchPurple
          UIImageName: Wordmark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryopang.partycharades
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
  PartyCharadesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/UITests
    dependencies:
      - target: PartyCharades
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PartyCharades
schemes:
  PartyCharades:
    build:
      targets:
        PartyCharades: all
        PartyCharadesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PartyCharadesUITests
