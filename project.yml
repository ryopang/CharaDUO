name: PartyCharades
options:
  bundleIdPrefix: com.ryopang
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  Content:
    path: Packages/Content
  Core:
    path: Packages/Core
  Posture:
    path: Packages/Posture
  Capture:
    path: Packages/Capture
  Design:
    path: Packages/Design
targets:
  PartyCharades:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/Sources
    resources:
      - path: App/Resources
    dependencies:
      - package: Content
        product: Content
      - package: Core
        product: Core
      - package: Posture
        product: Posture
      - package: Capture
        product: Capture
      - package: Design
        product: Design
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Party Charades"
        CFBundleDevelopmentRegion: "en"
        # PRD §7.1 — explicit and honest: what is recorded, and that it
        # stays on the device.
        NSCameraUsageDescription: "Party Charades records the guessing team's reactions during a round so you can watch the highlights together at the end of the match. Video stays on this device and is never uploaded."
        NSMicrophoneUsageDescription: "Party Charades records the table's audio so the highlight reel has sound. Audio stays on this device, is never uploaded, and is never analysed."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryopang.partycharades
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
  PartyCharadesUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/UITests
    dependencies:
      - target: PartyCharades
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PartyCharades
schemes:
  PartyCharades:
    build:
      targets:
        PartyCharades: all
        PartyCharadesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PartyCharadesUITests
